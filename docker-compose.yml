services:
  hivemetastore:
    image: postgres:11.5
    hostname: hivemetastore
    environment:
      POSTGRES_PASSWORD: new_password
    volumes:
    - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    - metastore:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      spark_net:
        ipv4_address: 172.30.1.4
    extra_hosts:
    - master:172.30.1.1
    - worker1:172.30.1.2
    - worker2:172.30.1.3
    - worker3:172.30.1.7
  master:
    image: examen-superstore-hive:local
    entrypoint:
    - /bin/bash
    - /opt/examen/entrypoint.sh
    stop_grace_period: 60s
    hostname: master
    depends_on:
      hivemetastore:
        condition: service_healthy
    environment:
      HADOOP_NODE: namenode
      HIVE_CONFIGURE: yes, please
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_IP: 172.30.1.1
      SPARK_MASTER_HOST: 172.30.1.1
      SPARK_LOCAL_HOSTNAME: master
    volumes:
    - ./datos:/data/datos:ro
    - ./sql:/data/sql:ro
    - ./resultados:/data/resultados
    - namenode:/dfs/name
    networks:
      spark_net:
        ipv4_address: 172.30.1.1
    extra_hosts:
    - worker1:172.30.1.2
    - worker2:172.30.1.3
    - hivemetastore:172.30.1.4
    - worker3:172.30.1.7
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
    - 127.0.0.1:11000:10000
    - 127.0.0.1:19870:9870
    - 127.0.0.1:18088:8088
  worker1:
    image: examen-superstore-hive:local
    entrypoint:
    - /bin/bash
    - /opt/examen/entrypoint.sh
    stop_grace_period: 60s
    hostname: worker1
    depends_on:
    - hivemetastore
    environment:
      SPARK_MASTER_ADDRESS: spark://master:7077
      SPARK_WORKER_PORT: 8881
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_HOSTNAME: worker1
      SPARK_LOCAL_IP: 172.30.1.2
      SPARK_MASTER_HOST: 172.30.1.1
      HADOOP_NODE: datanode
    volumes:
    - ./datos:/data/datos:ro
    - ./sql:/data/sql:ro
    - ./resultados:/data/resultados
    - worker1:/dfs/data
    networks:
      spark_net:
        ipv4_address: 172.30.1.2
    extra_hosts:
    - master:172.30.1.1
    - worker2:172.30.1.3
    - hivemetastore:172.30.1.4
    - worker3:172.30.1.7
    build:
      context: .
      dockerfile: docker/Dockerfile
  worker2:
    image: examen-superstore-hive:local
    entrypoint:
    - /bin/bash
    - /opt/examen/entrypoint.sh
    stop_grace_period: 60s
    hostname: worker2
    depends_on:
    - hivemetastore
    environment:
      SPARK_MASTER_ADDRESS: spark://master:7077
      SPARK_WORKER_PORT: 8882
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_HOSTNAME: worker2
      SPARK_LOCAL_IP: 172.30.1.3
      SPARK_MASTER_HOST: 172.30.1.1
      HADOOP_NODE: datanode
    volumes:
    - ./datos:/data/datos:ro
    - ./sql:/data/sql:ro
    - ./resultados:/data/resultados
    - worker2:/dfs/data
    networks:
      spark_net:
        ipv4_address: 172.30.1.3
    extra_hosts:
    - master:172.30.1.1
    - worker1:172.30.1.2
    - hivemetastore:172.30.1.4
    - worker3:172.30.1.7
    build:
      context: .
      dockerfile: docker/Dockerfile
  worker3:
    image: examen-superstore-hive:local
    entrypoint:
    - /bin/bash
    - /opt/examen/entrypoint.sh
    stop_grace_period: 60s
    hostname: worker3
    depends_on:
    - hivemetastore
    environment:
      SPARK_MASTER_ADDRESS: spark://master:7077
      SPARK_WORKER_PORT: 8883
      SPARK_WORKER_WEBUI_PORT: 8083
      SPARK_PUBLIC_DNS: localhost
      SPARK_LOCAL_HOSTNAME: worker3
      SPARK_LOCAL_IP: 172.30.1.7
      SPARK_MASTER_HOST: 172.30.1.1
      HADOOP_NODE: datanode
    volumes:
    - ./datos:/data/datos:ro
    - ./sql:/data/sql:ro
    - ./resultados:/data/resultados
    - worker3:/dfs/data
    networks:
      spark_net:
        ipv4_address: 172.30.1.7
    extra_hosts:
    - master:172.30.1.1
    - worker1:172.30.1.2
    - worker2:172.30.1.3
    - hivemetastore:172.30.1.4
    build:
      context: .
      dockerfile: docker/Dockerfile
networks:
  spark_net:
    ipam:
      driver: default
      config:
      - subnet: 172.30.0.0/16
name: examen-superstore-bonny
volumes:
  metastore: {}
  namenode: {}
  worker1: {}
  worker2: {}
  worker3: {}
